name: Build Draft Release

on:
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create or update the GitHub draft release (main only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    name: Read release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Verify draft release branch
        if: ${{ inputs.create_draft && github.ref != 'refs/heads/main' }}
        shell: bash
        run: |
          echo "::error::Draft releases can only be created from main."
          exit 1

      - uses: actions/checkout@v6

      - id: version
        name: Read version from pyproject.toml
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$(python -c 'import json; print(json.load(open("vcpkg.json"))["version-semver"])')" = "$version"
          grep -q "project(KrakenEngine VERSION ${version} LANGUAGES CXX)" CMakeLists.txt
          IFS=. read -r major minor patch <<< "$version"
          grep -q "#define KN_VERSION_MAJOR ${major}" include/kraken/Runtime.hpp
          grep -q "#define KN_VERSION_MINOR ${minor}" include/kraken/Runtime.hpp
          grep -q "#define KN_VERSION_PATCH ${patch}" include/kraken/Runtime.hpp
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

  build_wheels:
    name: Build wheel (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up vcpkg cache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: .vcpkg_cache
          key: draft-Linux-vcpkg-${{ github.sha }}
          restore-keys: |
            draft-Linux-vcpkg-
            Linux-vcpkg-cache-

      - name: Create vcpkg cache directory
        if: runner.os == 'Linux'
        run: mkdir -p .vcpkg_cache

      - name: Set up vcpkg
        if: runner.os == 'Windows' || runner.os == 'macOS'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ runner.os == 'Windows' && 'C:/vcpkg' || '/Users/runner/work/vcpkg' }}
          vcpkgJsonGlob: "vcpkg.json"

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Build wheel
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD_FRONTEND: "build[uv]"
          CIBW_BUILD: "cp312-*"
          CIBW_SKIP: "*-musllinux_* *-win32"

          CIBW_BEFORE_ALL_WINDOWS: >
            pip install ninja &&
            git config --global --add safe.directory C:/vcpkg
          CIBW_ENVIRONMENT_WINDOWS: >
            CC=cl CXX=cl
            VCPKG_ROOT=C:/vcpkg
            VCPKG_DEFAULT_TRIPLET=x64-windows-release
            VCPKG_MANIFEST_FEATURES=python
            CMAKE_GENERATOR=Ninja
            CMAKE_ARGS=-DVCPKG_MANIFEST_FEATURES=python
            VCPKG_KEEP_PDB=0

          CIBW_ENVIRONMENT_MACOS: >
            CC=clang CXX=clang++
            MACOSX_DEPLOYMENT_TARGET=11.0
            CMAKE_GENERATOR=Ninja
            CMAKE_ARGS="-DSDL3_SHADERCROSS_VENDORED=ON -DVCPKG_MANIFEST_FEATURES=python"
            VCPKG_ROOT=/Users/runner/work/vcpkg
            VCPKG_DEFAULT_TRIPLET=arm64-osx-release
            VCPKG_MANIFEST_FEATURES=python

          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_BEFORE_ALL_LINUX: >
            dnf -y install gcc gcc-c++
            ninja-build git curl zip unzip tar
            alsa-lib-devel pipewire-devel pulseaudio-libs-devel
            libX11-devel libXext-devel libXft-devel
            libXrandr-devel libXcursor-devel libXi-devel libXinerama-devel libXfixes-devel libXScrnSaver-devel libXtst-devel
            mesa-libEGL-devel mesa-libgbm-devel
            wayland-devel wayland-protocols-devel libxkbcommon-devel
            vulkan-headers vulkan-loader-devel
            ibus-devel
            libpng-devel libjpeg-turbo-devel freetype-devel flac-devel libzstd-devel
            autoconf autoconf-archive automake libtool pkgconfig perl-core &&
            git clone https://github.com/microsoft/vcpkg.git /opt/vcpkg &&
            cd /opt/vcpkg &&
            git checkout 256acc64012b23a13041d8705805e1f23b43a024 &&
            ./bootstrap-vcpkg.sh -disableMetrics
          CIBW_ENVIRONMENT_LINUX: >
            CC=gcc CXX=g++
            CMAKE_GENERATOR=Ninja
            CMAKE_ARGS="-DSDL3_SHADERCROSS_VENDORED=ON -DVCPKG_MANIFEST_FEATURES=python"
            VCPKG_ROOT=/opt/vcpkg
            VCPKG_DEFAULT_TRIPLET=x64-linux-release
            VCPKG_DEFAULT_BINARY_CACHE=/project/.vcpkg_cache
            VCPKG_MANIFEST_FEATURES=python

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          path: ./wheelhouse/*.whl
          archive: false

  test_wheels:
    name: Test wheel (${{ matrix.os }} / Python ${{ matrix.python-version }})
    needs: build_wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: [3.12, 3.13, 3.14]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download platform wheel
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: |
            ${{ runner.os == 'Windows' && '*win_amd64.whl' || '' }}
            ${{ runner.os == 'macOS' && '*macosx*.whl' || '' }}
            ${{ runner.os == 'Linux' && '*manylinux*.whl' || '' }}

      - name: Install wheel
        shell: bash
        run: |
          chmod +x scripts/install_wheels.sh
          ./scripts/install_wheels.sh

      - name: Set up Xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libgl1

      - name: Run tests
        shell: bash
        run: |
          mv python _python_backup
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -s "-screen 0 1920x1080x24" python -m pytest tests -q
          else
            python -m pytest tests -q
          fi
          mv _python_backup python

  build_bundled_cpp:
    name: Build bundled-source C++ library
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxft-dev \
            libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgbm-dev libvulkan-dev \
            libibus-1.0-dev

      - name: Configure bundled-source build
        run: >
          cmake -S . -B build/bundled -G Ninja
          -DKRAKEN_BUILD_PYTHON=OFF
          -DKRAKEN_INSTALL=OFF
          -DKRAKEN_DEPENDENCIES=BUNDLED
          -DCMAKE_BUILD_TYPE=Release

      - name: Build bundled-source library
        run: cmake --build build/bundled --parallel 2

  build_sdk:
    name: Build SDK (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-15
            triplet: arm64-osx
            suffix: macos-arm64.tar.gz
            experimental: false
            archive: tar
          - name: Windows x64
            runner: windows-2025
            triplet: x64-windows-static-md
            suffix: windows-x64.zip
            experimental: false
            archive: zip
          - name: Windows ARM64
            runner: windows-11-arm
            triplet: arm64-windows-static-md
            suffix: windows-arm64.zip
            experimental: true
            archive: zip

    steps:
      - uses: actions/checkout@v6

      - name: Set SDK asset name
        shell: bash
        run: echo "SDK_ASSET=kraken-sdk-${{ needs.prepare.outputs.tag }}-${{ matrix.suffix }}" >> "$GITHUB_ENV"

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.triplet == 'arm64-windows-static-md' && 'arm64' || 'x64' }}

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg

      - name: Configure SDK
        shell: bash
        run: >
          cmake -S . -B build/sdk
          -DKRAKEN_BUILD_PYTHON=OFF
          -DKRAKEN_INSTALL=ON
          -DKRAKEN_DEPENDENCIES=AUTO
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage"
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      - name: Build Kraken
        run: cmake --build build/sdk --config Release --parallel 2

      - name: Stage dependency prefix
        shell: bash
        run: >
          cmake -E copy_directory
          "build/sdk/vcpkg_installed/${{ matrix.triplet }}"
          "${{ github.workspace }}/stage"

      - name: Install Kraken
        run: cmake --install build/sdk --config Release

      - name: Add SDK metadata
        shell: bash
        run: |
          cmake -E copy LICENSE "${{ github.workspace }}/stage/LICENSE"
          cmake -E copy docs/cpp-quickstart.md "${{ github.workspace }}/stage/README.md"

      - name: Create macOS archive
        if: matrix.archive == 'tar'
        working-directory: stage
        run: cmake -E tar czf "../${{ env.SDK_ASSET }}" .

      - name: Create Windows archive
        if: matrix.archive == 'zip'
        working-directory: stage
        run: cmake -E tar cf "../${{ env.SDK_ASSET }}" --format=zip .

      - name: Extract SDK archive for validation
        shell: bash
        run: |
          cmake -E make_directory build/sdk-extracted
          cd build/sdk-extracted
          cmake -E tar xvf "../../${SDK_ASSET}"

      - name: Configure archived SDK consumer
        shell: bash
        run: >
          cmake -S tests/cpp_consumer -B build/sdk-consumer
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/sdk-extracted"

      - name: Build archived SDK consumer
        run: cmake --build build/sdk-consumer --config Release --parallel 2

      - name: Upload SDK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.SDK_ASSET }}
          archive: false

  create_draft:
    name: Create draft release
    needs: [prepare, test_wheels, build_bundled_cpp, build_sdk]
    if: ${{ inputs.create_draft && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "*.whl"
          merge-multiple: true

      - name: Download SDKs
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "kraken-sdk-*"
          merge-multiple: true

      - name: Verify required assets
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 3
          test -f "dist/kraken-sdk-${{ needs.prepare.outputs.tag }}-macos-arm64.tar.gz"
          test -f "dist/kraken-sdk-${{ needs.prepare.outputs.tag }}-windows-x64.zip"

      - name: Create or update draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Kraken Engine ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: dist/*
